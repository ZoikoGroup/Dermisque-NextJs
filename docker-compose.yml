# Local PostgreSQL for Dermisque.  Start: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: dermisque-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dermisque
      POSTGRES_USER: dermisque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - dermisque_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermisque -d dermisque"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dermisque_pg:
